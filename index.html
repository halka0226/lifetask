  <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Life OS">
  <link rel="manifest" href="manifest.json">
  <title>Life OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="celebration-overlay">
    <div class="praise-badge">✨ えらい！ ✨</div>
  </div>

  <div id="main-container"></div>

  <button id="floating-done-btn" onclick="openDoneModal()">
    <span class="floating-icon">📋</span>
    <span class="floating-text">できたこと</span>
    <span id="floating-done-count" class="floating-badge">0</span>
  </button>

  <div id="done-modal-overlay" onclick="closeDoneModal(event)">
    <div class="done-modal-sheet" onclick="event.stopPropagation()">
      <div class="done-modal-header">
        <div id="done-modal-title" style="font-weight:900; font-size:1.3rem;">📋 今日できたこと</div>
        <button class="done-modal-close" onclick="closeDoneModal()">✕</button>
      </div>
      <div id="done-modal-list" class="done-modal-body"></div>
    </div>
  </div>

  <div id="datepicker-modal-overlay" onclick="closeDatePickerModal()">
    <div class="datepicker-sheet" onclick="event.stopPropagation()">
      <div id="datepicker-modal-title" style="font-size:1.2rem; font-weight:900; margin-bottom:12px;">📅 日付を選択</div>
      <input type="date" id="datepicker-modal-input" class="form-control" style="font-size:1.3rem; padding:12px; margin-bottom:16px;">
      <div style="display:flex; gap:8px;">
        <button class="action-btn undo" style="flex:1; padding:14px; font-size:1.05rem;" onclick="closeDatePickerModal()">キャンセル</button>
        <button class="submit-btn" style="flex:1.5; padding:14px; font-size:1.05rem;" onclick="applyDatePickerSelection()">決定</button>
      </div>
      <button id="datepicker-clear-btn" class="action-btn undo" style="width:100%; margin-top:8px; padding:10px; color:#ff4757; display:none;" onclick="clearDatePickerSelection()">期限を解除する</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="today">
      <span class="nav-icon">☀️</span>
      <span class="nav-label">今日</span>
    </button>
    <button class="nav-btn" data-tab="freetime">
      <span class="nav-icon">🧹</span>
      <span class="nav-label">掃除</span>
    </button>
    <button class="nav-btn" data-tab="occasional">
      <span class="nav-icon">💡</span>
      <span class="nav-label">たまに</span>
    </button>
    <button class="nav-btn" data-tab="routine">
      <span class="nav-icon">🔄</span>
      <span class="nav-label">定期</span>
    </button>
    <button class="nav-btn" data-tab="all">
      <span class="nav-icon">📋</span>
      <span class="nav-label">全部</span>
    </button>
    <button class="nav-btn" data-tab="add">
      <span class="nav-icon">➕</span>
      <span class="nav-label">追加</span>
    </button>
    <button class="nav-btn" data-tab="history">
      <span class="nav-icon">📊</span>
      <span class="nav-label">履歴</span>
    </button>
    <button class="nav-btn" data-tab="settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">設定</span>
    </button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
